<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Antiques Catalogue</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; margin: 0; padding: 24px; background: #faf8f5; color: #2a2420; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #756a5e; margin-bottom: 20px; font-size: 0.9rem; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  input, select { padding: 8px 10px; border: 1px solid #d8cfc4; border-radius: 6px; font-size: 0.9rem; background: #fff; }
  input[type=text] { flex: 1; min-width: 220px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e5ddd2; border-radius: 10px; padding: 14px; }
  .card img.main { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; background: #eee; }
  .thumbs { display: flex; gap: 4px; margin-bottom: 8px; }
  .thumbs img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; background: #eee; cursor: pointer; border: 1px solid #e5ddd2; }
  .card h3 { margin: 0 0 4px; font-size: 1rem; }
  .cat { display: inline-block; font-size: 0.75rem; background: #ece4d8; color: #5c5346; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
  .field { font-size: 0.85rem; margin: 2px 0; }
  .field b { color: #756a5e; font-weight: 600; }
  .empty { color: #999; padding: 40px; text-align: center; }
</style>
</head>
<body>
  <h1>Family Antiques Catalogue</h1>
  <div class="sub">Browse the collection</div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search item, description, provenance...">
    <select id="categoryFilter"><option value="">All categories</option></select>
  </div>

  <div id="results" class="grid"></div>

  <script>
    // Same Apps Script Web App URL as the full view — the ?mode=public
    // parameter is what strips Value and Location on the server.
    const SCRIPT_URL = https://script.google.com/macros/s/AKfycbyQ_t9kVFb-Joy-eyJD0317_wcMUz4KCr5m6nt4iHK6jaYVk24yg5E2dkxiQra-F_Lh/exec;

    let allItems = [];

    async function load() {
      const res = await fetch(SCRIPT_URL + '?mode=public');
      allItems = await res.json();
      populateCategories();
      render();
    }

    function populateCategories() {
      const cats = [...new Set(allItems.map(i => i.Category).filter(Boolean))].sort();
      const sel = document.getElementById('categoryFilter');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const filtered = allItems.filter(i => {
        const matchesCat = !cat || i.Category === cat;
        const text = [i.Item, i.Description, i.Provenance, i.Material].join(' ').toLowerCase();
        return matchesCat && (!q || text.includes(q));
      });

      const el = document.getElementById('results');
      if (!filtered.length) {
        el.innerHTML = '<div class="empty">No items match.</div>';
        return;
      }

      el.innerHTML = filtered.map(i => {
        const photos = ['Photo1','Photo2','Photo3','Photo4','Photo5'].map(k => i[k]).filter(Boolean);
        return `
        <div class="card">
          ${photos[0] ? `<img class="main" src="${photos[0]}" alt="${i.Item || ''}" onclick="window.open('${photos[0]}','_blank')">` : ''}
          ${photos.length > 1 ? `<div class="thumbs">${photos.map(p => `<img src="${p}" onclick="window.open('${p}','_blank')">`).join('')}</div>` : ''}
          <div class="cat">${i.Category || ''}</div>
          <h3>${i.Item || ''}</h3>
          <div class="field">${i.Description || ''}</div>
          <div class="field"><b>Provenance:</b> ${i.Provenance || '—'}</div>
          <div class="field"><b>Date:</b> ${i.Date || '—'}</div>
          <div class="field"><b>Material:</b> ${i.Material || '—'}</div>
          <div class="field"><b>Weight:</b> ${i['Weight (g)'] || '—'} g</div>
          <div class="field"><b>Size:</b> ${i['Size (cm)'] || '—'} cm</div>
        </div>
      `;
      }).join('');
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('categoryFilter').addEventListener('change', render);
    load();
  </script>
</body>
</html>
